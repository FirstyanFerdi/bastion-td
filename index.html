<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BASTION - Grid Defense</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="topbar-row topbar-vitals">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5l11.5 6.5v14L16 29.5 4.5 23V9z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 20.5l6-8.5 6 8.5" fill="none" stroke="#e2a72e" stroke-width="2.6" stroke-linejoin="round"/></svg>
        <div><b>BASTION</b><small>GRID DEFENSE SYSTEM</small></div>
      </div>
      <div class="chips">
        <div class="chip" id="chipLives"><span class="ic" data-ico="shield"></span><div><label>LIVES</label><b id="vLives">25</b></div></div>
        <div class="chip" id="chipGold"><span class="ic" data-ico="coin"></span><div><label>GOLD</label><b id="vGold">0</b></div></div>
        <div class="chip"><span class="ic" data-ico="wave"></span><div><label>WAVE</label><b id="vWave">0</b></div></div>
        <div class="chip"><span class="ic" data-ico="target"></span><div><label>SCORE</label><b id="vScore">0</b><small id="vBestScore"></small></div></div>
        <div class="chip"><span class="ic" data-ico="flag"></span><div><label>BEST WAVE</label><b id="vBestWave">0</b></div></div>
        <div class="chip" id="chipCores"><span class="ic" data-ico="spark"></span><div><label>CORES</label><b id="vCores" style="color:#38bdf8">0</b></div></div>
        <div class="chip" id="chipPower"><span class="ic" data-ico="bolt"></span><div><label>GRID POWER</label><b id="vPower" style="color:#10b981">0 / 60 MW</b></div></div>
        <div class="chip" id="chipSector" title="Sector Expedition Dossier"><span class="ic" data-ico="flag"></span><div><label>SECTOR</label><b id="vSector" style="color:#f97316">01 FOUNDRY</b></div></div>
        <div class="chip" id="chipWeather" title="Atmospheric Micro-Climate Front"><span class="ic" data-ico="cloud"></span><div><label>ATMOSPHERE</label><b id="vWeather" style="color:#38bdf8">CLEAR</b></div></div>
      </div>
      <div class="ctrl-group sim" title="Simulation Controls">
        <div class="seg" id="speedSeg">
          <button data-speed="1" class="on" tabindex="-1">1x</button>
          <button data-speed="2" tabindex="-1">2x</button>
          <button data-speed="3" tabindex="-1">3x</button>
        </div>
        <button class="ibtn" id="btnPause" title="Pause (P)" tabindex="-1"></button>
        <button class="ibtn" id="btnMute" title="Mute (M)" tabindex="-1"></button>
      </div>
    </div>
    <div class="topbar-row topbar-actions">
      <!-- Systems Docks -->
      <div class="ctrl-group systems" title="Base Facilities & Classified Archives">
        <span class="ctrl-group-lbl">FACILITIES:</span>
        <button class="cbtn cbtn-hq" id="btnWorkshop" title="Workshop HQ (B)" tabindex="-1">HQ</button>
        <button class="cbtn cbtn-codex" id="btnCodex" title="Classified Tech Codex (C)" tabindex="-1">CODEX</button>
        <button class="cbtn cbtn-matrix" id="btnMatrix" title="Tactical Protocol Matrix (T)" tabindex="-1">MATRIX <span id="vTpp" class="cbtn-badge">0</span></button>
        <button class="cbtn cbtn-lab" id="btnGeneLab" title="Gene-Splicing & Void Alchemy Lab (G)" tabindex="-1">LAB [G]</button>
        <button class="cbtn cbtn-expedition" id="btnExpedition" title="Procedural Expedition Matrix Campaign" tabindex="-1">EXPEDITION</button>
        <button class="cbtn cbtn-heat" id="btnQuantumHeat" title="Quantum Ascension Heat Selector" tabindex="-1">HEAT <span id="vHeatVal" class="cbtn-badge">0</span></button>
        <button class="cbtn cbtn-logistics" id="btnLogistics" title="Tri-Resource Munitions Logistics & Edicts" tabindex="-1">LOGISTICS <span id="vLogisticsBadge" class="cbtn-badge">STD</span></button>
        <button class="cbtn cbtn-bonds" id="btnBonds" title="Syndicate War Bonds & High-Stakes Credit" tabindex="-1">BONDS <span id="vBondsBadge" class="cbtn-badge">0G</span></button>
        <button class="cbtn cbtn-bourse" id="btnBourse" title="Quantum Syndicate Bourse & Void Futures" tabindex="-1">BOURSE</button>
        <button class="cbtn cbtn-engrams" id="btnEngrams" title="Ancient Cyber-Engrams Forge & Chimera Synthesis" tabindex="-1">ENGRAMS <span id="vEngramsBadge" class="cbtn-badge">0</span></button>
        <button class="cbtn cbtn-directive" id="btnDirective" title="High Command Tactical Directives & Anti-Monotony Wagers" tabindex="-1">DIRECTIVE <span id="vDirectiveBadge" class="cbtn-badge">ACT</span></button>
      </div>

      <!-- Combat Protocols Dock -->
      <div class="ctrl-group protocols" title="Active Combat Override Protocols">
        <span class="ctrl-group-lbl">COMBAT OVERRIDES:</span>
        <button class="cbtn cbtn-purge" id="btnThermalPurge" title="Thermal Steam Purge (H): Vent heat & boil hostiles" tabindex="-1">PURGE [H]</button>
        <button class="cbtn cbtn-chrono" id="btnChrono" title="Chrono-Echo Splicer (Z): Rewind 5s & spawn Ghost Echoes" tabindex="-1">CHRONO [Z]</button>
        <button class="cbtn cbtn-anchor" id="btnAnchor" title="Chrono-Anchor [C]: Record timeline for 12s & unleash Quantum Reverberation" tabindex="-1">ANCHOR [C]</button>
        <button class="cbtn cbtn-overload" id="btnOverload" title="Reactor Overload (V): +250% Hyper-Drive" tabindex="-1">OVERLOAD [V]</button>
        <button class="cbtn cbtn-mech" id="btnMechPilot" title="Titan Mech Combat Pilot Mode (Tab)" tabindex="-1">MECH [TAB]</button>
        <button class="cbtn cbtn-exosuit" id="btnExosuit" title="Titan Mech Exosuit Archetype" tabindex="-1">EXOSUIT: <span id="vExosuitBadge">VANGUARD</span></button>
        <button class="cbtn cbtn-dread" id="btnDreadnought" title="Orbital Dreadnought 'Aegis Prime' Super-Strike" tabindex="-1">DREADNOUGHT <span id="vDreadCharge" class="cbtn-badge dread">0%</span></button>
        <button class="cbtn cbtn-spear" id="btnChronosSpear" title="Chronos Tungsten Orbital Spear [X]: Hypersonic kinetic strike & Singularity chasm" tabindex="-1">SPEAR [X] <span id="vSpearBadge" class="cbtn-badge">RDY</span></button>
        <button class="cbtn cbtn-companion" id="btnCompanionMode" title="Titan Mech Companion AI Doctrine [J]: Bulwark / Hunter / Sentry" tabindex="-1">DOCTRINE: <span id="vCompanionBadge">BULWARK</span></button>
        <button class="cbtn cbtn-parry" id="btnTitanParry" title="Titan Mech Aegis Parry [K]: Deflect incoming heavy mortars with 350% reflected damage" tabindex="-1">PARRY [K]</button>
      </div>
    </div>
  </header>

  <main id="main">
    <section id="stage">
      <div id="canvasWrap">
        <canvas id="game"></canvas>
        <div id="overlay"></div>
      </div>
    </section>
    <aside id="side">
      <div class="card" id="waveCard">
        <div class="wc-head"><span class="lbl">NEXT WAVE</span><b id="wcNum">1</b></div>
        <div class="wc-badges" id="wcBadges"></div>
        <div class="tags" id="wcTags"></div>
        <div id="wcContract"></div>
        <button class="primary" id="btnCall" tabindex="-1">Start Wave 1</button>
        <div class="hint" id="wcHint">Calling early pays a gold bonus. Clearing a wave pays interest on unspent gold.</div>
      </div>
      <div class="card" id="inspector"></div>
    </aside>
  </main>

  <div id="cmdTray">
    <div class="cmd-skills" id="cmdSkills"></div>
    <div class="perk-tray" id="perkTray"></div>
  </div>
  <footer id="dock"></footer>
</div>

<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/enemies.js"></script>
<script src="js/towers.js"></script>
<script src="js/waves.js"></script>
<script src="js/sprites.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
